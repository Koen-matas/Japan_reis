<style>
  :root{
    --paper:#F4F3EC;
    --paper-2:#ECE9DF;
    --ink:#1B1B18;
    --ink-soft:#5B584E;
    --line: rgba(27,27,24,0.14);
    --accent:#C4622D;
    --display:'Space Grotesk', system-ui, sans-serif;
    --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--display);
    -webkit-font-smoothing:antialiased;
    padding-bottom:48px;
  }
  a{color:inherit;}
  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  /* Top bar */
  header.topbar{
    position:sticky; top:0; z-index:50;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:10px 14px 0 14px;
  }
  .topbar-title{
    font-weight:700;
    font-size:15px;
    letter-spacing:.02em;
    display:flex;
    align-items:baseline;
    gap:8px;
    padding-bottom:8px;
  }
  .topbar-title small{
    font-family:var(--mono);
    font-weight:400;
    font-size:11px;
    color:var(--ink-soft);
    text-transform:uppercase;
  }
  nav.pills{
    display:flex;
    gap:6px;
    overflow-x:auto;
    scrollbar-width:none;
    padding-bottom:10px;
    -webkit-overflow-scrolling:touch;
  }
  nav.pills::-webkit-scrollbar{display:none;}
  .pill{
    flex:0 0 auto;
    font-family:var(--mono);
    font-size:11.5px;
    letter-spacing:.03em;
    text-transform:uppercase;
    padding:7px 12px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--paper-2);
    color:var(--ink-soft);
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s, color .15s, border-color .15s;
  }
  .pill.active{
    background:var(--pill-accent, var(--accent));
    border-color:var(--pill-accent, var(--accent));
    color:#fff;
  }
  /* Sections */
  main{padding:18px 14px 8px 14px; max-width:640px; margin:0 auto;}
  section.tab{display:none;}
  section.tab.active{display:block; animation:fadein .18s ease;}
  @keyframes fadein{from{opacity:0} to{opacity:1}}
  h1.hero{
    font-size:30px;
    line-height:1.05;
    margin:6px 0 4px 0;
    letter-spacing:-.01em;
  }
  p.lede{
    color:var(--ink-soft);
    font-size:14.5px;
    line-height:1.5;
    margin:0 0 20px 0;
  }
  h2.section-title{
    font-size:12px;
    font-family:var(--mono);
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--ink-soft);
    margin:26px 0 10px 0;
    padding-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  h2.section-title:first-of-type{margin-top:0;}
  .card{
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:10px;
    background:rgba(255,255,255,.35);
  }
  .card .k{
    font-family:var(--mono);
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--ink-soft);
    margin-bottom:3px;
  }
  .card .v{font-weight:600; font-size:15px; margin-bottom:2px;}
  .card .sub{font-size:12.5px; color:var(--ink-soft);}
  .card .sub a{text-decoration:underline; text-decoration-color:var(--line);}
  /* weather strip */
  .wx-strip{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none;}
  .wx-strip::-webkit-scrollbar{display:none;}
  .wx-chip{
    flex:0 0 auto;
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    min-width:84px;
    text-align:center;
    background:rgba(255,255,255,.35);
  }
  .wx-chip .region{font-family:var(--mono); font-size:9.5px; text-transform:uppercase; color:var(--ink-soft); letter-spacing:.05em;}
  .wx-chip .temp{font-weight:700; font-size:17px; margin:3px 0;}
  .wx-chip .cond{font-size:10.5px; color:var(--ink-soft);}
  /* day timeline */
  .day-head{margin-bottom:14px;}
  .day-head .date{font-size:12px; font-family:var(--mono); color:var(--accent); font-weight:600; letter-spacing:.04em; text-transform:uppercase;}
  .day-head h1{margin:2px 0 4px 0;}
  .day-head .cond{font-family:var(--mono); font-size:11.5px; color:var(--ink-soft);}
  ol.timeline{list-style:none; margin:0; padding:0; border-left:2px solid var(--line); margin-left:6px;}
  ol.timeline li{position:relative; padding:0 0 20px 22px;}
  ol.timeline li::before{
    content:'';
    position:absolute; left:-7px; top:2px;
    width:12px; height:12px; border-radius:50%;
    background:var(--paper);
    border:2.5px solid var(--accent);
  }
  ol.timeline li .time{
    font-family:var(--mono); font-size:11px; color:var(--accent); font-weight:600; letter-spacing:.03em; display:block; margin-bottom:2px;
  }
  ol.timeline li .place{
    display:inline-block; font-weight:700; font-size:15.5px; text-decoration:none;
    border-bottom:1.5px solid var(--accent);
  }
  ol.timeline li .note{display:block; font-size:12.5px; color:var(--ink-soft); margin-top:3px; line-height:1.4;}
  .callout{
    margin-top:16px;
    border-left:3px solid var(--accent);
    background:rgba(0,0,0,.03);
    padding:10px 12px;
    border-radius:0 8px 8px 0;
  }
  .callout .tag{font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.07em; color:var(--accent); font-weight:700; display:block; margin-bottom:3px;}
  .callout p{margin:0; font-size:13px; line-height:1.45; color:var(--ink-soft);}
  /* info page */
  .subhead{font-weight:700; font-size:15px; margin:18px 0 6px 0;}
  ul.tips, ol.tips{margin:0 0 10px 0; padding-left:18px; font-size:13.5px; line-height:1.55; color:var(--ink);}
  ul.tips li, ol.tips li{margin-bottom:5px;}
  .pack-chips{display:flex; flex-wrap:wrap; gap:7px; margin-top:8px;}
  .pack-chip{
    font-family:var(--mono); font-size:11.5px;
    border:1px solid var(--line); border-radius:999px; padding:5px 11px;
    background:rgba(255,255,255,.4);
  }
  /* bars page */
  .place-card{
    border:1px solid var(--line); border-radius:10px; padding:11px 13px; margin-bottom:8px;
    background:rgba(255,255,255,.35);
  }
  .place-card a.name{font-weight:700; font-size:14.5px; text-decoration:none; border-bottom:1.5px solid var(--accent);}
  .place-card .area{font-family:var(--mono); font-size:10px; text-transform:uppercase; color:var(--ink-soft); letter-spacing:.05em; float:right;}
  .place-card .desc{display:block; font-size:12.5px; color:var(--ink-soft); margin-top:4px; clear:both;}
  footer{
    max-width:640px; margin:26px auto 0 auto; padding:16px 14px 0 14px;
    border-top:1px solid var(--line);
    font-family:var(--mono); font-size:11px; color:var(--ink-soft); text-align:center;
  }
  /* interactive map */
  .map-intro{font-size:13px; color:var(--ink-soft); line-height:1.5; margin:0 0 14px 0;}
  .map-wrap{border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  #japanMap{height:460px; width:100%; background:var(--paper-2);}
  .city-dot{
    width:15px; height:15px; border-radius:50%;
    background:var(--accent); border:2.5px solid #fff;
    box-shadow:0 0 0 1.5px var(--accent);
  }
  .city-label{
    font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:.03em;
    color:var(--ink); background:rgba(244,243,236,.92); padding:1px 6px; border-radius:4px;
    border:1px solid var(--line); white-space:nowrap; box-shadow:none;
  }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip{font-family:var(--display);}
  .map-popup .name{font-weight:700; font-size:14.5px; margin-bottom:2px;}
  .map-popup .stay{font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:8px;}
  .map-popup .daylink{
    display:block; width:100%; text-align:left; font-family:var(--mono); font-size:11.5px;
    padding:5px 8px; margin-bottom:4px; border:1px solid var(--line); border-radius:6px;
    background:var(--paper-2); color:var(--ink); cursor:pointer;
  }
  .map-popup .daylink:hover{background:var(--accent); color:#fff; border-color:var(--accent);}
  @media (prefers-reduced-motion:reduce){ section.tab.active{animation:none;} }
</style>
</head>

/* ---------- MAP page data ---------- */
const CITIES = [
  {key:'tokyo',     name:'Tokyo',       lat:35.6895, lng:139.6917, stay:'6–10 & 26–28 Oct', days:[3,4,5,7,8,23,24,25]},
  {key:'nikko',     name:'Nikko',       lat:36.7199, lng:139.6982, stay:'Day trip · 9 Oct', days:[6]},
  {key:'hakone',    name:'Hakone',      lat:35.2323, lng:139.1069, stay:'11–12 Oct', days:[8,9]},
  {key:'kyoto',     name:'Kyoto',       lat:35.0116, lng:135.7681, stay:'12–17 Oct', days:[9,10,11,12,13,14]},
  {key:'kumano',    name:'Kumano Kodo', lat:33.8397, lng:135.7727, stay:'17–20 Oct', days:[14,15,16,17]},
  {key:'koyasan',   name:'Koyasan',     lat:34.2125, lng:135.5858, stay:'20–21 Oct', days:[17,18]},
  {key:'osaka',     name:'Osaka',       lat:34.6937, lng:135.5023, stay:'21–24 Oct', days:[18,19,20]},
  {key:'himeji',    name:'Himeji',      lat:34.8394, lng:134.6939, stay:'Day trip · 24 Oct', days:[21]},
  {key:'hiroshima', name:'Hiroshima',   lat:34.3853, lng:132.4553, stay:'24–26 Oct', days:[21,22]},
  {key:'miyajima',  name:'Miyajima',    lat:34.2969, lng:132.3196, stay:'25–26 Oct', days:[22]},
];
const ROUTE_ORDER = ['tokyo','nikko','tokyo','hakone','kyoto','kumano','koyasan','osaka','himeji','hiroshima','miyajima','tokyo'];

let japanMap = null;
function dayLabel(n){
  const day = DAYS[n-1];
  return day ? (day.d + ' — ' + day.title) : ('Day ' + n);
}
function initMap(){
  if(japanMap) return;
  japanMap = L.map('japanMap', {scrollWheelZoom:false});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:18,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors'
  }).addTo(japanMap);

  const cityByKey = {};
  CITIES.forEach(c => cityByKey[c.key] = c);

  const routeLatLngs = ROUTE_ORDER.map(k => [cityByKey[k].lat, cityByKey[k].lng]);
  L.polyline(routeLatLngs, {color:'#C4622D', weight:2.5, opacity:.75, dashArray:'1 8', lineCap:'round'}).addTo(japanMap);

  const bounds = [];
  CITIES.forEach(city => {
    const icon = L.divIcon({className:'', html:'<div class="city-dot"></div>', iconSize:[15,15], iconAnchor:[7,7]});
    const marker = L.marker([city.lat, city.lng], {icon}).addTo(japanMap);
    marker.bindTooltip(city.name, {permanent:true, direction:'top', offset:[0,-6], className:'city-label'});

    const popupEl = document.createElement('div');
    popupEl.className = 'map-popup';
    popupEl.innerHTML = `<div class="name">${city.name}</div><div class="stay">${city.stay}</div>` +
      city.days.map(n => `<button class="daylink" data-day="d${n}">${dayLabel(n)}</button>`).join('');
    popupEl.querySelectorAll('.daylink').forEach(btn => {
      btn.addEventListener('click', () => showTab(btn.dataset.day));
    });
    marker.bindPopup(popupEl);
    bounds.push([city.lat, city.lng]);
  });
  japanMap.fitBounds(bounds, {padding:[26,26]});
}

/* ---------- render ---------- */
const pillNav = document.getElementById('pillNav');
const tabRoot = document.getElementById('tabRoot');

function makePill(id, label, accent){
  const b = document.createElement('button');
  b.className = 'pill';
  b.textContent = label;
  b.dataset.tab = id;
  if(accent) b.style.setProperty('--pill-accent', accent);
  b.addEventListener('click', () => showTab(id));
  pillNav.appendChild(b);
}

function makeSection(id){
  const s = document.createElement('section');
  s.className = 'tab';
  s.id = 'tab-' + id;
  tabRoot.appendChild(s);
  return s;
}

/* Trip tab */
makePill('trip', 'Trip');
const tripSection = makeSection('trip');
tripSection.innerHTML = `
  <span class="eyebrow">Group trip companion · 6\u201328 Oct 2026</span>
  <h1 class="hero">JAPAN</h1>
  <p class="lede">A packed, mid-range three-week loop: Tokyo, Nikko, Hakone, Kyoto, the Kumano Kodo, Koyasan, Osaka, Himeji, Hiroshima and Miyajima. Tap a place to open it in Maps.</p>

`;

const mapSection = makeSection('map');

  <h1 class="hero" style="font-size:24px;">Route map</h1>
  <p class="map-intro">Tap a city marker to see which days you're there, then jump straight to that day's plan.</p>
  <div class="map-wrap"><div id="japanMap"></div></div>
`;

/* Day tabs */
DAYS.forEach((day, i) => {
  const accent = accentFor(i, DAYS.length);
  const id = 'd' + (i+1);
  makePill(id, day.short, accent);
  const s = makeSection(id);
  s.style.setProperty('--accent', accent);
  s.innerHTML = `
    <div class="day-head">
      <div class="date">${day.d}</div>
      <h1 class="hero">${day.title}</h1>
      <div class="cond">${day.cond}</div>
    </div>
    <ol class="timeline">
      ${day.stops.map(st => `<li><span class="time">${st.t}</span><a class="place" target="_blank" href="${mapsLink(st.q)}">${st.p}</a><span class="note">${st.n}</span></li>`).join('')}
    </ol>
  `;
});

/* Info tab */
makePill('info', 'Info');
const infoSection = makeSection('info');
infoSection.innerHTML = `<h1 class="hero" style="font-size:24px;">Practical info</h1>` + INFO_HTML;

/* Bars tab */
makePill('bars', 'Bars');
const barsSection = makeSection('bars');
barsSection.style.setProperty('--accent', '#C4622D');
barsSection.innerHTML = `<h1 class="hero" style="font-size:24px;">Bars & nightlife</h1>` + BARS_HTML;

/* tab switching */
function showTab(id){
  document.querySelectorAll('section.tab').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  document.querySelector('.pill[data-tab="' + id + '"]').classList.add('active');
  window.scrollTo({top:0, behavior:'instant'});
  const pill = document.querySelector('.pill[data-tab="' + id + '"]');
  pill.scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'});
  if(id === 'map'){
    initMap();
    setTimeout(() => { if(japanMap) japanMap.invalidateSize(); }, 50);
  }
}
showTab('trip');
</script>
